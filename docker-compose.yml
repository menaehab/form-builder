services:
  php:
    build:
      context: .
      dockerfile: dockerfile

    container_name: laravel-php

    working_dir: /var/www

    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis

    volumes:
      - ./:/var/www
      - vendor-data:/var/www/vendor

  nginx:
    image: nginx:latest

    container_name: laravel-nginx

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php
  mysql:
    image: mysql:8.4

    container_name: laravel-mysql

    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  node:
    build:
      context: .
      dockerfile: dockerfile

    container_name: laravel-node

    working_dir: /var/www

    ports:
      - "5173:5173"

    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=root

    volumes:
      - ./:/var/www
      - /var/www/node_modules
      - vendor-data:/var/www/vendor

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  redis:
    image: redis:7-alpine

    container_name: laravel-redis

volumes:
  mysql-data:
  vendor-data:
